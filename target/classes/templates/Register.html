<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Dog Food Sales</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-beige-100 min-h-screen flex items-center justify-center" style="background-color: #fef6e4;">
  <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-lg text-center">
    <h2 class="text-3xl font-bold text-yellow-800 mb-4">🐾 Create an Account</h2>
    <p class="mb-6 text-yellow-900">Register to start managing your pet's nutrition</p>

    <!-- Error Message Display -->
    <div th:if="${param.error}" class="text-red-500 text-sm mb-4">
      <p>Email is already taken. Please try a different one.</p>
    </div>

    <form th:action="@{/register}" method="post" class="space-y-4 text-left">
      <div>
        <label class="block text-yellow-800 font-medium mb-1">Full Name</label>
        <input type="text" name="CUSTOMER_NAME" class="w-full px-4 py-2 border border-yellow-300 rounded-lg focus:ring-2 focus:ring-yellow-400" required>
      </div>
      <div>
        <label class="block text-yellow-800 font-medium mb-1">Username</label>
        <input type="text" name="CUSTOMER_USERNAME" class="w-full px-4 py-2 border border-yellow-300 rounded-lg focus:ring-2 focus:ring-yellow-400" required>
      </div>
      <div>
        <label class="block text-yellow-800 font-medium mb-1">Password</label>
        <input type="password" name="CUSTOMER_PASSWORD" class="w-full px-4 py-2 border border-yellow-300 rounded-lg focus:ring-2 focus:ring-yellow-400" required>
      </div>
      <div>
        <label class="block text-yellow-800 font-medium mb-1">Email</label>
        <input type="email" name="CUSTOMER_EMAIL" class="w-full px-4 py-2 border border-yellow-300 rounded-lg focus:ring-2 focus:ring-yellow-400" required>
      </div>
      <div>
        <label class="block text-yellow-800 font-medium mb-1">Phone Number</label>
        <input type="number" name="CUSTOMER_PHONENUMBER" class="w-full px-4 py-2 border border-yellow-300 rounded-lg focus:ring-2 focus:ring-yellow-400" required>
      </div>
      <div>
        <label class="block text-yellow-800 font-medium mb-1">Address</label>
        <input type="text" name="CUSTOMER_ADDRESS" class="w-full px-4 py-2 border border-yellow-300 rounded-lg focus:ring-2 focus:ring-yellow-400">
      </div>
      <div>
        <label class="block text-yellow-800 font-medium mb-1">City</label>
        <input type="text" name="CUSTOMER_CITY" class="w-full px-4 py-2 border border-yellow-300 rounded-lg focus:ring-2 focus:ring-yellow-400">
      </div>

      <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 rounded-lg transition duration-200">
        Register
      </button>
    </form>

    <p class="mt-6 text-yellow-800">Already have an account?</p>
    <a href="/login" class="inline-block mt-2 text-yellow-600 hover:text-yellow-700 font-semibold underline">Login here</a>

    <div class="mt-6 text-yellow-700 text-sm">
      🐕 Join the pack and track your pup’s favorite products!
    </div>
  </div>
</body>

</html>
