<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Food Products</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #fffaf3; /* soft beige */
      background-image: url('https://www.transparenttextures.com/patterns/paw-print.png');
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>

<body class="text-gray-800">
  <div class="container mx-auto px-4 py-10">
    <header class="mb-6">
        <h1 class="text-4xl font-extrabold text-yellow-800 text-center mb-2">🐾 Dog Food Sales Product</h1>
        <p class="text-center text-yellow-700">Your trusted hub for all pet product needs</p>
      </header>
  
      <!-- Navigation -->
      <nav class="flex justify-center space-x-6 mb-8 bg-yellow-50 rounded-xl px-6 py-4 shadow-md">
        <a href="/dashboard" class="text-yellow-800 font-semibold hover:text-yellow-600 transition duration-200">Home</a>
        <a href="/profile" class="text-yellow-800 font-semibold hover:text-yellow-600 transition duration-200">Profile</a>
        <a href="/products" class="text-yellow-800 font-semibold hover:text-yellow-600 transition duration-200">Products</a>
        <a href="/login" class="text-red-500 font-semibold hover:text-red-700 transition duration-200">Logout</a>
      </nav>
  

    <div class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
      <div th:each="product : ${products}" class="bg-white rounded-2xl shadow-lg p-6 border border-yellow-200 hover:shadow-xl transition duration-300 ease-in-out">
        <div class="flex justify-between items-start mb-4">
          <h2 class="text-xl font-bold text-yellow-800" th:text="${product.PRODUCT_NAME}"></h2>
          <span class="text-sm bg-yellow-100 text-yellow-700 px-2 py-1 rounded" th:text="${product.PRODUCT_BRAND}"></span>
        </div>
        <p class="text-sm text-gray-600 mb-3" th:text="${product.PRODUCT_DESCRIPTION}"></p>
        <div class="mb-4">
          <p class="text-sm"><strong>Quantity:</strong> <span th:text="${product.PRODUCT_QUANTITY}"></span></p>
          <p class="text-sm"><strong>In Stock:</strong> <span th:text="${product.PRODUCT_QUANTITY_STOCK}"></span></p>
          <p class="text-lg font-semibold text-green-700 mt-2" th:text="${product.PRODUCT_PRICE} + ' PHP'"></p>
        </div>
        <form th:action="@{/cart/add}" method="post">
          <input type="hidden" name="productId" th:value="${product.PRODUCT_ID}" />
          <button type="submit"
            class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold px-4 py-2 rounded-xl shadow">
            🛒 Add to Cart
          </button>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
