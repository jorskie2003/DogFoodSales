<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Food Products</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #fffaf3;
      /* soft beige */
      background-image: url('https://www.transparenttextures.com/patterns/paw-print.png');
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>

</head>

<body class="text-gray-800">
  <div class="container px-4 py-10 mx-auto">
    <!-- Header -->
    <header class="mb-6">
      <h1 class="mb-2 text-4xl font-extrabold text-center text-yellow-800">🐾 Dog Food Sales Product</h1>
      <p class="text-center text-yellow-700">Your trusted hub for all pet product needs</p>
    </header>

    <!-- Product Added Modal -->
    <div th:if="${addedProduct != null}"
      class="fixed inset-0 flex items-center justify-center bg-gray-800 bg-opacity-50 modal">
      <div class="p-6 bg-white rounded shadow-lg modal-content">
        <h2 class="text-lg font-semibold text-green-700">Added to Cart ✅</h2>
        <p th:text="'You have added ' + ${addedProduct.PRODUCT_NAME} + ' to your cart!'"></p>
        <div class="flex justify-between mt-4">
          <a th:href="@{/cart}" class="px-4 py-2 text-white bg-green-500 rounded">View Cart</a>
          <a th:href="@{/products}" class="px-4 py-2 ml-5 bg-gray-300 rounded">Continue Shopping</a>
        </div>
      </div>
    </div>


    <!-- Navigation -->
    <nav class="flex justify-center px-6 py-4 mb-8 space-x-6 shadow-md bg-yellow-50 rounded-xl">
      <a href="/dashboard" class="font-semibold text-yellow-800 transition duration-200 hover:text-yellow-600">Home</a>
      <a href="/profile" class="font-semibold text-yellow-800 transition duration-200 hover:text-yellow-600">Profile</a>
      <a href="/products"
        class="font-semibold text-yellow-800 transition duration-200 hover:text-yellow-600">Products</a>
      <a href="/login" class="font-semibold text-red-500 transition duration-200 hover:text-red-700">Logout</a>
      <a href="/cart" class="font-semibold text-yellow-800 transition duration-200 hover:text-yellow-600">View Cart
        🛒</a>
    </nav>


    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      <div th:each="product : ${products}"
        class="p-6 transition duration-300 ease-in-out bg-white border border-yellow-200 shadow-lg rounded-2xl hover:shadow-xl">
        <div class="flex items-start justify-between mb-4">
          <!-- Product Image -->
          <img th:src="${product.imageFileName}" alt="Dog Food" class="object-cover w-full h-48 rounded-md shadow-md">
          <h2 class="text-xl font-bold text-yellow-800" th:text="${product.PRODUCT_NAME}"></h2>
          <span class="px-2 py-1 text-sm text-yellow-700 bg-yellow-100 rounded"
            th:text="${product.PRODUCT_BRAND}"></span>
        </div>
        <p class="mb-3 text-sm text-gray-600" th:text="${product.PRODUCT_DESCRIPTION}"></p>
        <div class="mb-4">
          <p class="text-sm"><strong>Quantity:</strong> <span th:text="${product.PRODUCT_QUANTITY}"></span></p>
          <p class="text-sm"><strong>In Stock:</strong> <span th:text="${product.PRODUCT_QUANTITY_STOCK}"></span></p>
          <p class="mt-2 text-lg font-semibold text-green-700" th:text="${product.PRODUCT_PRICE} + ' PHP'"></p>
        </div>
        <form th:action="@{/add-to-cart}" method="post">
          <input type="hidden" name="productId" th:value="${product.PRODUCT_ID}" />
          <button type="submit"
            class="w-full px-4 py-2 font-semibold text-white bg-green-500 shadow hover:bg-green-600 rounded-xl">
            🛒 Add to Cart
          </button>
        </form>
      </div>
    </div>
  </div>

</body>

</html>
