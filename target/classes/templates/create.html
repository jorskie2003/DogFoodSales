<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mx-auto mt-5">
    <h2 class="text-2xl font-bold mb-5">Add product</h2>
    <form th:action="@{/products}" th:object="${product}" method="post">
      <table class="table-auto w-full border-collapse border border-gray-200">
        <tbody>
          <tr class="border-b">
            <td class="px-4 py-2 text-right font-semibold">Product Name:</td>
            <td class="px-4 py-2"><input type="text" th:field="*{PRODUCT_NAME}" class="w-full p-2 border border-gray-300 rounded" required></td>
          </tr>
          <tr class="border-b">
            <td class="px-4 py-2 text-right font-semibold">Brand:</td>
            <td class="px-4 py-2"><input type="text" th:field="*{PRODUCT_BRAND}" class="w-full p-2 border border-gray-300 rounded" required></td>
          </tr>
          <tr class="border-b">
            <td class="px-4 py-2 text-right font-semibold">Price:</td>
            <td class="px-4 py-2"><input type="number" th:field="*{PRODUCT_PRICE}" class="w-full p-2 border border-gray-300 rounded" required></td>
          </tr>
          <tr class="border-b">
            <td class="px-4 py-2 text-right font-semibold">Quantity:</td>
            <td class="px-4 py-2"><input type="number" th:field="*{PRODUCT_QUANTITY}" class="w-full p-2 border border-gray-300 rounded" required></td>
          </tr>
          <tr class="border-b">
            <td class="px-4 py-2 text-right font-semibold">Product Stock:</td>
            <td class="px-4 py-2"><input type="number" th:field="*{PRODUCT_QUANTITY_STOCK}" class="w-full p-2 border border-gray-300 rounded" required></td>
          </tr>
          <tr class="border-b">
            <td class="px-4 py-2 text-right font-semibold">Product Description:</td>
            <td class="px-4 py-2"><input type="text" th:field="*{PRODUCT_DESCRIPTION}" class="w-full p-2 border border-gray-300 rounded" required></td>
          </tr>
          <tr>
            <td colspan="2" class="px-4 py-3 text-center">
              <button type="submit" class="bg-green-500 text-white p-2 rounded hover:bg-green-600">Save</button>
              <a href="/products" class="ml-2 bg-gray-300 p-2 rounded hover:bg-gray-400">Cancel</a>
            </td>
          </tr>
        </tbody>
      </table>
    </form>
  </div>
</body>
</html>
