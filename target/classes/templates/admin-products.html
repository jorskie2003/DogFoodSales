<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Food Products</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #fef6e4;
      /* light beige */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>

<body class="text-gray-800">
  <div class="container px-4 py-6 mx-auto">
    <h1 class="mb-6 text-4xl font-bold text-center text-yellow-700">🐶 Admin Dog Food Database 🦴</h1>

    <div class="flex justify-center mb-6 space-x-4">
      <a href="/products/new" class="px-4 py-2 text-white bg-yellow-400 rounded-lg shadow hover:bg-yellow-500">
        ➕ Add Product
      </a>
      <a href="/customer" class="px-4 py-2 text-white bg-yellow-400 rounded-lg shadow hover:bg-yellow-500">
        🧍‍♂️ View Customers
      </a>
      <a href="/login" class="px-4 py-2 text-white bg-red-400 rounded-lg shadow hover:bg-red-500">Logout</a>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full overflow-hidden bg-white border border-yellow-300 rounded-lg shadow-md">
        <thead class="bg-yellow-100">
          <tr>
            <th class="px-4 py-3 text-left">ID</th>
            <th class="px-4 py-3 text-left">Product Name</th>
            <th class="px-4 py-3 text-left">Brand</th>
            <th class="px-4 py-3 text-left">Description</th>
            <th class="px-4 py-3 text-left">Quantity</th>
            <th class="px-4 py-3 text-left">Price</th>
            <th class="px-4 py-3 text-left">Stock</th>
            <th class="px-4 py-3 text-left">Image</th>
            <th class="px-4 py-3 text-left">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="product : ${products}" class="hover:bg-yellow-50">
            <td class="px-4 py-2 border-b" th:text="${product.PRODUCT_ID}"></td>
            <td class="px-4 py-2 border-b" th:text="${product.PRODUCT_NAME}"></td>
            <td class="px-4 py-2 border-b" th:text="${product.PRODUCT_BRAND}"></td>
            <td class="px-4 py-2 border-b" th:text="${product.PRODUCT_DESCRIPTION}"></td>
            <td class="px-4 py-2 border-b" th:text="${product.PRODUCT_QUANTITY}"></td>
            <td class="px-4 py-2 border-b" th:text="${product.PRODUCT_PRICE} + ' PHP'"></td>
            <td class="px-4 py-2 border-b" th:text="${product.PRODUCT_QUANTITY_STOCK}"></td>
            <td class="px-4 py-2">
              <img th:src="@{${product.imageFileName}}" alt="Product Image" class="w-16 h-16" />
            </td>
            <td class="px-4 py-2 border-b">
              <div class="flex gap-4">
                <a th:href="@{/products/admin-editproducts/{id}(id=${product.PRODUCT_ID})}"
                  class="p-2 text-white bg-yellow-500 rounded hover:bg-yellow-600">Edit</a>
                <form th:action="@{/products/delete/{id}(id=${product.PRODUCT_ID})}" method="post"
                  style="display: inline;">
                  <input type="hidden" name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                  <button type="submit" class="p-2 text-red-900 bg-red-500 rounded hover:bg-red-600"
                    onclick="return confirm('Are you sure you want to delete this product?')">Delete</button>
                </form>
              </div>
            </td>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>

</html>
