<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-yellow-50">
<div class="container mx-auto mt-5">
    <h2 class="mb-5 text-2xl font-bold text-center"> 🐕 My Order History 🛒</h2>
    <nav class="px-4 py-3 border-t max-w-7xl mx-auto">
        <ul class="flex justify-center space-x-8">
          <li><a href="/dashboard" class="text-gray-700 hover:text-amber-800">Home</a></li>
          <li><a href="/profile" class="text-gray-700 hover:text-amber-800">Profile</a></li>
          <li><a href="/products" class="text-gray-700 hover:text-amber-800">Products</a></li>
          <li><a href="/login" class="text-red-600 hover:text-red-800">Logout</a></li>
        </ul>
      </nav>
      
    <div th:if="${#lists.isEmpty(orders)}">
        <p class="text-center text-gray-600">You have no orders yet.</p>
    </div>
    <div th:unless="${#lists.isEmpty(orders)}">
        <div th:each="order : ${orders}" class="mb-10 border rounded shadow p-4">
            <div class="mb-2 font-semibold">
                Order #<span th:text="${order.id}"></span> &mdash;
                <span th:text="${order.orderDate}"></span>
            </div>
            <div class="mb-2 text-sm text-gray-600">
                Shipping: <span th:text="${order.shippingAddress}"></span>,
                <span th:text="${order.shippingCity}"></span>,
                <span th:text="${order.shippingRegion}"></span>,
                <span th:text="${order.shippingZip}"></span>
                | Phone: <span th:text="${order.shippingPhone}"></span>
            </div>
            <table class="min-w-full bg-white border border-collapse border-gray-200 mb-2">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="px-4 py-2 font-semibold text-left">Product</th>
                        <th class="px-4 py-2 font-semibold text-left">Quantity</th>
                        <th class="px-4 py-2 font-semibold text-left">Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${order.items}">
                        <td class="p-4">
                            <div class="flex items-center space-x-4">
                                <img th:src="@{${item.product.imageFileName}}" alt="Product Image"
                                    class="object-contain w-16 h-16 rounded">
                                <span th:text="${item.product.PRODUCT_NAME}"></span>
                            </div>
                        </td> 
                        <td class="px-4 py-2 border-b" th:text="${item.quantity}"></td>
                        <td th:text="${item.quantity * item.product.PRODUCT_PRICE} + ' PHP'" class="p-4"></td>
                    </tr>
                </tbody>
            </table>
            <div class="mb-2 font-semibold text-right">
                Total: 
                <span th:text="${#numbers.formatDecimal(order.totalOrderPrice, 0, 'COMMA', 2, 'POINT')} + ' PHP'"></span>
            </div>
        </div>
    </div>
    <div class="mt-6 text-center">
        <a href="/products" class="text-blue-600 hover:underline">← Back to Shop</a>
    </div>
</div>
</body>
</html>
