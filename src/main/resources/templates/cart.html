<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>

<body class="text-gray-900 bg-yellow-50">
    <div class="max-w-5xl p-6 mx-auto">
        <h1 class="mb-6 text-3xl font-bold">Your Cart 🛒</h1>

        <table class="w-full overflow-hidden bg-white rounded shadow">
            <thead class="bg-gray-100 border-b">
                <tr>
                    <th class="p-4 text-left">PRODUCT</th>
                    <th class="p-4">QUANTITY</th>
                    <th class="p-4">PRICE</th>
                    <th class="p-4">SUBTOTAL</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${cartItems}" class="border-b">
                    <td class="p-4">
                        <div class="flex items-center space-x-4">
                            <img th:src="@{${item.product.imageFileName}}" alt="Product Image"
                                class="object-contain w-16 h-16 rounded">
                            <span th:text="${item.product.PRODUCT_NAME}"></span>
                        </div>
                    </td>
                    <td th:text="${item.quantity}" class="p-6 text-center"></td>
                    <td th:text="${item.product.PRODUCT_PRICE} + ' PHP'" class="p-6 text-center"></td>
                    <td th:text="${item.quantity * item.product.PRODUCT_PRICE} + ' PHP'" class="p-4"></td>
                </tr>
                <tr th:if="${cartItems.isEmpty()}">
                    <td colspan="4" class="p-4 text-center">Your cart is empty.</td>
                </tr>
            </tbody>
        </table>

        <!-- Summary Section -->
        <div class="flex justify-end p-4 mt-6 space-x-8 text-lg font-semibold bg-white rounded shadow">
            <div>
                <p>Subtotal:</p>
                <p class="font-normal text-gray-600"
                    th:text="${#numbers.formatDecimal(totalPrice, 0,'COMMA', 2, 'POINT')} + ' PHP'"></p>
            </div>
            <div>
                <p>Shipping:</p>
                <p class="font-normal text-gray-600">Free</p>
            </div>
            <div>
                <p>Total:</p>
                <p th:text="${#numbers.formatDecimal(totalPrice, 1, 'COMMA', 2, 'POINT')} + ' PHP'"></p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-between mt-8">
            <a href="/products" class="px-6 py-2 bg-gray-300 rounded hover:bg-gray-400">Continue Shopping</a>
            <a href="/checkout" class="px-6 py-2 text-white bg-green-600 rounded hover:bg-green-700">Proceed to
                Checkout</a>
        </div>
    </div>
</body>

</html>
