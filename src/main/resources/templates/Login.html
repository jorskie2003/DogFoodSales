<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Dog Food Sales</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="flex items-center justify-center min-h-screen bg-beige-100" style="background-color: #fef6e4;">
  <div class="w-full max-w-md p-10 text-center bg-white shadow-lg rounded-2xl">
    <h2 class="mb-6 text-3xl font-bold text-yellow-800">🐶 Welcome Back!</h2>
    <p class="mb-4 text-yellow-900">Login to manage your dog food products</p>

    <form th:action="@{/login}" method="post" class="space-y-4 text-left">
      <div>
        <label for="username" class="block mb-1 font-medium text-yellow-800">Email</label>
        <input type="text" id="username" name="username"
          class="w-full px-4 py-2 border border-yellow-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400"
          required>
      </div>
      <div>
        <label for="password" class="block mb-1 font-medium text-yellow-800">Password</label>
        <input type="password" id="password" name="password"
          class="w-full px-4 py-2 border border-yellow-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400"
          required>
      </div>
      <button type="submit"
        class="w-full py-2 font-bold text-white transition duration-200 bg-yellow-500 rounded-lg hover:bg-yellow-600">
        Login
      </button>
    </form>

    <p class="mt-6 text-yellow-800">Don't have an account?</p>
    <a href="/register" class="inline-block mt-2 font-semibold text-yellow-600 underline hover:text-yellow-700">Register
      here</a>

    <div class="mt-6 text-sm text-yellow-700">
      🐾 Your loyal pet partner in managing dog food sales!
    </div>
  </div>
</body>

</html>
