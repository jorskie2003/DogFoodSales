<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Dog Food Sales</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-beige-100 min-h-screen flex items-center justify-center" style="background-color: #fef6e4;">
  <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-md text-center">
    <h2 class="text-3xl font-bold text-yellow-800 mb-6">🐶 Welcome Back!</h2>
    <p class="mb-4 text-yellow-900">Login to manage your dog food products</p>

    <form th:action="@{/login}" method="post" class="space-y-4 text-left">
      <div>
        <label for="username" class="block text-yellow-800 font-medium mb-1">Username</label>
        <input type="text" id="username" name="username"
          class="w-full px-4 py-2 border border-yellow-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
      </div>
      <div>
        <label for="password" class="block text-yellow-800 font-medium mb-1">Password</label>
        <input type="password" id="password" name="password"
          class="w-full px-4 py-2 border border-yellow-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" required>
      </div>
      <button type="submit"
        class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 rounded-lg transition duration-200">
        Login
      </button>
    </form>

    <p class="mt-6 text-yellow-800">Don't have an account?</p>
    <a href="/register"
      class="inline-block mt-2 text-yellow-600 hover:text-yellow-700 font-semibold underline">Register here</a>

    <div class="mt-6 text-yellow-700 text-sm">
      🐾 Your loyal pet partner in managing dog food sales!
    </div>
  </div>
</body>

</html>
